[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
compio = { version = "0.19", features = ["macros", "net", "signal", "time"] }
crossfire = "3.1"
futures-util = "0.3"
libc = "0.2"
mimalloc = "*"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
quote = "1"
smallvec = "1.15"
syn = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
