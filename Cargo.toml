[workspace]
resolver = "3"
members = [
    "uju",
    "uju-demo",
    "uju-ecs",
    "uju-io",
    "uju-mesh",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
compio = { version = "0.19", features = ["net", "signal", "time"] }
crossfire = "3.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
